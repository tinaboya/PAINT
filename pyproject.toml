[project]
name = "paint"
version = "1.0.0"
description = "Medical Pain Extraction & Evaluation Toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Boya Zhang" },
    { name = "Yuanchao Ma" },
    { name = "Jiageng Wu" },
    { name = "Douglas Teodoro" },
    { name = "Leo Anthony Celi" },
]
keywords = ["medical", "nlp", "pain-extraction", "multilingual", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Text Processing :: Linguistic",
]

# The paper-reproduction pipeline (src/paint/*.py) is standard-library
# only — no runtime dependencies are required to reproduce the results.
dependencies = []

[project.optional-dependencies]
# Only needed for extraction_evaluation.py --location-metric semantic.
semantic = [
    "sentence-transformers>=2.2.0",
]
# Only needed to read .xlsx annotation sheets; the released sheets are CSV.
xlsx = [
    "openpyxl>=3.1",
]
dev = [
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paint"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]




